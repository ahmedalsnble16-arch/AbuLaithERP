name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      
      - name: Remove old Android folder
        run: |
          rm -rf android
          rm -rf .dart_tool
      
      - name: Create fresh Android platform files
        run: flutter create . --project-name abu_laith_erp --org com.abulaith --platforms android
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Analyze code
        run: flutter analyze 2>&1 | tee analysis_report.txt
      
      - name: Upload Analysis Report
        uses: actions/upload-artifact@v4
        with:
          name: analysisreports
          path: analysis_report.txt
      
      - name: Build APK
        run: flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
