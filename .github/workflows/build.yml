name: Build Flutter APK

on:
  push:
    branches: [ main, رئيسي ]
  pull_request:
    branches: [ main, رئيسي ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project files
        run: |
          if [ -f "AbuLaithERP.zip" ]; then
            unzip AbuLaithERP.zip
          fi
          if [ -d "AbuLaithERP" ]; then
            cp -r AbuLaithERP/* .
          fi

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Remove Old Android Folder (If Any)
        run: |
          rm -rf android
          rm -rf .android
          rm -rf .dart_tool

      - name: Recreate Platform Files Correctly
        run: |
          flutter create . --org com.abulaith --project-name abu_laith_erp --platforms android

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Dart Code
        run: |
          flutter analyze 2>&1 | tee analysis.txt

      - name: Upload Analysis Report
        uses: actions/upload-artifact@v4
        with:
          name: analysis-report
          path: analysis.txt

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: abu_laith_erp_apk
          path: build/app/outputs/flutter-apk/app-release.apk
